name: homelab

services:
  homepage:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: homelab-dev
    ports:
      - "3030:3000"
    environment:
      TZ: America/Sao_Paulo
      LINK_HOST: homelab
      ALLOWED_DEV_ORIGINS: homelab,homelab01
      DOCKER_SOCKET: /var/run/docker.sock
      HOST_ROOT: /host
      DB_PATH: /app/data/homepage.db
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - homelab_node_modules:/app/node_modules
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro,rslave
    group_add:
      - "990"

volumes:
  homelab_node_modules:
